<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulador de Phishing — Demo</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial,sans-serif;background:#10131a;color:#eee;padding:20px}.card{width:min(430px,100%);background:#1b202b;padding:28px;border-radius:16px;box-shadow:0 12px 40px #0008}h1{margin-top:0}input,button{width:100%;padding:13px;margin-top:10px;border-radius:8px;border:1px solid #444}button{cursor:pointer;background:#fff;color:#111;border:0;font-weight:bold}.notice{font-size:13px;color:#aaa;line-height:1.5}#result{margin-top:18px;font-weight:bold;line-height:1.5}
</style>
</head>
<body>
<main class="card">
<h1>Simulador de Phishing</h1>
<p class="notice">Laboratorio educativo. Usa únicamente datos ficticios. Esta demo no guarda ni transmite contraseñas.</p>
<form id="demo">
<label>Usuario de prueba</label>
<input id="user" autocomplete="off" placeholder="usuario-demo">
<label>Contraseña ficticia</label>
<input id="pass" type="password" autocomplete="off" placeholder="••••••••">
<button type="submit">Iniciar sesión (simulación)</button>
</form>
<div id="result"></div>
</main>
<script>
document.getElementById('demo').addEventListener('submit',e=>{
e.preventDefault();
const user=document.getElementById('user').value.trim();
document.getElementById('result').textContent=user?'DEMO: intento detectado. La contraseña fue descartada y no se transmitió.':'Introduce un usuario ficticio.';
document.getElementById('pass').value='';
});
</script>
</body>
</html>
