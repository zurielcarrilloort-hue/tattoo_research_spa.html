<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulador de Phishing — Demo</title>
<style>
body{font-family:Arial,sans-serif;background:#10131a;color:#eee;display:grid;place-items:center;min-height:100vh;margin:0}
.card{width:min(430px,90%);background:#1b202b;padding:28px;border-radius:16px;box-shadow:0 12px 40px #0008}
input,button{width:100%;padding:12px;margin-top:10px;border-radius:8px;border:1px solid #444;box-sizing:border-box}
button{cursor:pointer;background:#fff;color:#111;border:0;font-weight:bold}
.notice{font-size:13px;color:#aaa;line-height:1.5}
#result{margin-top:18px;font-weight:bold}
</style>
</head>
<body>
<main class="card">
<h1>Simulador de Phishing</h1>
<p class="notice">Esta es una demostración educativa. Nunca introduzcas contraseñas reales. Los datos escritos aquí NO se envían a ningún servidor.</p>
<form id="demo">
<label>Usuario de prueba</label>
<input id="user" autocomplete="off" placeholder="usuario-demo">
<label>Contraseña ficticia</label>
<input id="pass" type="password" autocomplete="off" placeholder="••••••••">
<button type="submit">Iniciar sesión (simulación)</button>
</form>
<div id="result"></div>
</main>
<script>
document.getElementById('demo').addEventListener('submit',e=>{
 e.preventDefault();
 const user=document.getElementById('user').value.trim();
 const result=document.getElementById('result');
 result.textContent=user
   ? 'DEMO: se detectó un intento de inicio de sesión. No se guardó ni transmitió ninguna contraseña.'
   : 'DEMO: introduce un usuario ficticio para continuar.';
 document.getElementById('pass').value='';
});
</script>
</body>
</html>
